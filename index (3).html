<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>زیست‌یار | بازی حافظه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Vazirmatn,sans-serif;background:linear-gradient(135deg,#0b1736,#0f766e);color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
h1,h2{text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{height:110px;cursor:pointer;transform-style:preserve-3d;transition:.5s;position:relative}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;backface-visibility:hidden}
.front{background:#fff;color:#111}
.back{background:linear-gradient(135deg,#06b6d4,#3b82f6);font-size:40px}
.front{transform:rotateY(180deg)}
.matched .front{background:#dcfce7}
.info{text-align:center;font-size:22px;margin:15px}
.win{display:none;background:#fff;color:#111;border-radius:20px;padding:20px;text-align:center;margin-top:20px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<h1>🧬 زیست‌یار - بازی حافظه</h1>
<h2>✨ طراح: خانم معصومه مرتجایی</h2>
<div class="info">⭐ <span id="score">0</span> / 10</div>
<div id="grid" class="grid"></div>

<div id="win" class="win">
<h1>🏆 تبریک!</h1>
<h2>🎉 همه جفت‌ها را پیدا کردید</h2>
<p>آفرین شرکت‌کننده عزیز، شما روابط همزیستی را با موفقیت شناسایی کردید.</p>
</div>
</div>

<script>
const pairs=[
["مورچه و شته","همیاری"],
["زنبور و گل","همیاری"],
["میگوی تمیزکننده و کوسه","همیاری"],
["گلسنگ","همیاری"],
["باکتری روده و انسان","همیاری"],
["شیر و کفتار","همسفرگی"],
["ماهی کوچک و کوسه","همسفرگی"],
["لاک‌پشت و جلبک","همسفرگی"],
["کرمک و انسان","انگلی"],
["کنه و گاو","انگلی"]
];
let cards=[];
pairs.forEach((p,i)=>{
 cards.push({txt:p[0],id:i});
 cards.push({txt:p[1],id:i});
});

cards.sort(()=>Math.random()-0.5);

const grid=document.getElementById("grid");
let first=null,second=null,lock=false,score=0;

cards.forEach(c=>{
 const el=document.createElement("div");
 el.className="card";
 el.dataset.id=c.id;

 el.innerHTML=`
 <div class="face back">❓</div>
 <div class="face front">${c.txt}</div>`;

 el.onclick=()=>{
   if(lock||el.classList.contains("flip")) return;

   el.classList.add("flip");

   if(!first){ first=el; return; }

   second=el;
   lock=true;

   if(first.dataset.id===second.dataset.id){
      first.classList.add("matched");
      second.classList.add("matched");
      score++;
      document.getElementById("score").textContent=score;

      first=null; second=null; lock=false;

      if(score===10){
         document.getElementById("win").style.display="block";
      }
   }else{
      setTimeout(()=>{
         first.classList.remove("flip");
         second.classList.remove("flip");
         first=null; second=null; lock=false;
      },1000);
   }
 };

 grid.appendChild(el);
});
</script>
</body>
</html>
