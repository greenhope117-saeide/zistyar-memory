<body>

<div class="dna dna1">🧬</div>
<div class="dna dna2">🧬</div>

<!-- صفحه شروع -->
<div id="startPage" class="card">
  <div class="sampad-logo">
    <div class="sampad-icon">🎓</div>
    <div class="school-name">🏫 مدرسه فرزانگان ۱ شهریار</div>

  <h1>🧬 زیست‌یار</h1>
  <h2>✨ طراح: خانم معصومه مرتجایی</h2>
  <br>
  <p style="font-size:1.2rem; font-weight:500; color:#334155;">
    🌿 شرکت‌کننده گرامی
    <br><br>
    نوع رابطه همزیستی موجودات زیر را مشخص کنید.
  </p>
  <br><br>
  <button class="btn" id="startBtn">
    <i class="fas fa-play"></i> شروع بازی
  </button>
</div>

<!-- صفحه بازی -->
<div id="gamePage" class="card hidden">
  <div class="progress">
    📖 سؤال <span id="current">1</span> از <span id="total">10</span>
  </div>
  <div id="msg" class="message"></div>
  <div id="question" class="question"></div>
  <button class="btn option" data-choice="همیاری">
    <i class="fas fa-handshake"></i> 🤝 همیاری
  </button>
  <button class="btn option" data-choice="همسفرگی">
    <i class="fas fa-fish"></i> 🍽️ همسفرگی
  </button>
  <button class="btn option" data-choice="انگلی">
    <i class="fas fa-bug"></i> 🪱 انگلی
  </button>
  <br><br>
  <div style="font-size:1.3rem; font-weight:800; background:#f1f5f9; padding:12px; border-radius:50px;">
    ⭐ امتیاز: <span id="score" style="color:#0f766e; font-size:1.8rem;">0</span>
  </div>
</div>

<!-- صفحه پایان -->
<div id="finishPage" class="card hidden">
  <div id="medal" class="medal">🥇</div>
  <h1>🎉 تبریک</h1>
  <br>
  <p id="resultText" style="font-size:1.3rem; font-weight:500;"></p>
  <br>
  <button class="btn" id="restartBtn">
    <i class="fas fa-redo-alt"></i> بازی دوباره
  </button>
</div>

<script>
// ---------- بانک سوالات با آیکون‌های جذاب ----------
const originalQuestions = [
  { text: "🐜 مورچه و شته 🐞", answer: "همیاری" },
  { text: "🐝 زنبور و گل 🌸", answer: "همیاری" },
  { text: "🦐 میگوی تمیزکننده و کوسه 🦈", answer: "همیاری" },
  { text: "🍄 گلسنگ (قارچ + جلبک) 🌿", answer: "همیاری" },
  { text: "🦠 باکتری روده و انسان 👤", answer: "همیاری" },
  { text: "🦁 شیر و کفتار 🐾", answer: "همسفرگی" },
  { text: "🐟 ماهی کوچک و کوسه 🦈", answer: "همسفرگی" },
  { text: "🐢 لاک‌پشت و جلبک 🪸", answer: "همسفرگی" },
  { text: "🪱 کرمک و انسان 👤", answer: "انگلی" },
  { text: "🕷️ کنه و گاو 🐄", answer: "انگلی" }
];

// متغیرهای سراسری
let shuffledQuestions = [];
let currentIndex = 0;
let currentScore = 0;
let waitingForNext = false;
let currentButtons = [];

// پیام‌های تشویقی
const correctMessages = ["آفرین ✨", "احسنت 🌟", "عالی بود 🎉"];
const wrongMessages = ["دوباره فکر کن 💭", "دقت کن 🎯"];

// صدای کف زدن
function playClapSound() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const gainNode = audioContext.createGain();
    gainNode.connect(audioContext.destination);
    gainNode.gain.value = 0.35;
    
    const now = audioContext.currentTime;
    const bufferSize = 4096;
    const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * 0.5;
    }
    
    const noise = audioContext.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    noise.connect(gainNode);
    noise.start();
    
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    noise.stop(now + 0.35);
    
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
  } catch(e) {
    console.log("صدای کف زدن پشتیبانی نمی‌شود");
  }
}

function createConfetti() {
  for (let i = 0; i < 70; i++) {
    const conf = document.createElement("div");
    conf.classList.add("confetti");
    const colors = ["#fbbf24", "#34d399", "#f87171", "#60a5fa", "#c084fc", "#f472b6", "#fb923c"];
    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    conf.style.left = Math.random() * 100 + "%";
    conf.style.width = Math.random() * 12 + 6 + "px";
    conf.style.height = Math.random() * 12 + 6 + "px";
    conf.style.position = "fixed";
    conf.style.top = "-20px";
    conf.style.borderRadius = "50%";
    conf.style.opacity = "0.9";
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 2200);
  }
}

function loadCurrentQuestion() {
  if (currentIndex >= shuffledQuestions.length) {
    finishGame();
    return;
  }
  document.getElementById("current").textContent = currentIndex + 1;
  const qData = shuffledQuestions[currentIndex];
  document.getElementById("question").innerHTML = qData.text;
  
  const msgDiv = document.getElementById("msg");
  msgDiv.innerHTML = "";
  msgDiv.style.color = "#111";
  msgDiv.style.background = "#f8fafc";
  
  currentButtons.forEach(btn => {
    btn.classList.remove("correct-effect", "wrong-effect");
    btn.disabled = false;
  });
  waitingForNext = false;
}

function onAnswer(choice, btnElement) {
  if (waitingForNext) return;
  if (!shuffledQuestions[currentIndex]) return;

  const correctAnswer = shuffledQuestions[currentIndex].answer;
  const msgDiv = document.getElementById("msg");

  waitingForNext = true;
  currentButtons.forEach(btn => { btn.disabled = true; });

  if (choice === correctAnswer) {
    playClapSound();
    createConfetti();
    
    const randomMsg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
    msgDiv.innerHTML = `✅ ${randomMsg}`;
    msgDiv.style.color = "#16a34a";
    msgDiv.style.background = "#dcfce7";
    
    btnElement.classList.add("correct-effect");
    currentScore++;
    document.getElementById("score").textContent = currentScore;
    
    setTimeout(() => {
      btnElement.classList.remove("correct-effect");
      currentIndex++;
      if (currentIndex >= shuffledQuestions.length) {
        finishGame();
      } else {
        loadCurrentQuestion();
      }
    }, 900);
    
  } else {
    if (currentScore > 0) {
      currentScore--;
    }
    document.getElementById("score").textContent = currentScore;
    
    const randomMsg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];
    msgDiv.innerHTML = `❌ ${randomMsg}<br>📚 پاسخ صحیح: ${correctAnswer}`;
    msgDiv.style.color = "#dc2626";
    msgDiv.style.background = "#fee2e2";
    
    btnElement.classList.add("wrong-effect");
    
    setTimeout(() => {
      btnElement.classList.remove("wrong-effect");
      currentButtons.forEach(btn => { btn.disabled = false; });
      waitingForNext = false;
      setTimeout(() => {
        if (msgDiv.innerHTML.includes("❌")) {
          msgDiv.innerHTML = "";
          msgDiv.style.background = "#f8fafc";
        }
      }, 1600);
    }, 1200);
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initGame() {
  shuffledQuestions = shuffleArray([...originalQuestions]);
  currentIndex = 0;
  currentScore = 0;
  waitingForNext = false;
  
  document.getElementById("score").textContent = "0";
  document.getElementById("total").textContent = shuffledQuestions.length;
  
  const btns = document.querySelectorAll("#gamePage .btn.option");
  currentButtons = [];
  
  btns.forEach(btn => {
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    
    const choice = newBtn.getAttribute("data-choice");
    if (choice) {
      newBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        onAnswer(choice, newBtn);
      });
      currentButtons.push(newBtn);
    }
  });
  
  loadCurrentQuestion();
}

function finishGame() {
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("finishPage").classList.remove("hidden");
  
  const totalQuestions = shuffledQuestions.length;
  let medal = "🥉";
  let medalText = "مدال برنز";
  if (currentScore >= 8 && currentScore <= 9) {
    medal = "🥈";
    medalText = "مدال نقره";
  }
  if (currentScore === 10) {
    medal = "🥇";
    medalText = "مدال طلا";
  }
  if (currentScore < 5) {
    medal = "🥉";
    medalText = "مدال برنز";
  }
  
  document.getElementById("medal").textContent = medal;
  document.getElementById("resultText").innerHTML = 
    `🌟 شما موفق شدید ${currentScore} امتیاز از ${totalQuestions} کسب کنید.<br><br>🏅 ${medalText}<br><br>🌿 روابط همزیستی را با موفقیت بررسی کردید.`;
  
  if (medal === "🥇") {
    createConfetti();
    setTimeout(createConfetti, 400);
  }
}

function startGame() {
  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  initGame();
}

function restartGame() {
  document.getElementById("finishPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  initGame();
}

document.addEventListener("DOMContentLoaded", function() {
  const startBtn = document.getElementById("startBtn");
  if (startBtn) {
    startBtn.addEventListener("click", startGame);
  }
  
  const restartBtn = document.getElementById("restartBtn");
  if (restartBtn) {
    restartBtn.addEventListener("click", restartGame);
  }
});
</script>
</body>
</html>
