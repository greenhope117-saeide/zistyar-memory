DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>زیست‌یار</title> <style> body{ font-family:tahoma; margin:0; background:#f0f8ff; text-align:center; } .screen{ display:none; padding:20px; } .active{ display:block; } h1{ color:#2e7d32; } button{ padding:12px; margin:8px; width:90%; max-width:350px; border:none; border-radius:12px; font-size:18px; cursor:pointer; } .option{ background:#ffffff; } .start-btn{ background:#4caf50; color:white; font-size:22px; } #score{ font-size:22px; color:#1565c0; } .medal{ font-size:80px; } #confetti{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; } </style> </head> <body> <canvas id="confetti"></canvas> <!-- صفحه شروع --> <div id="startScreen" class="screen active"> <h1>🧬 زیست‌یار</h1> <h3>طراح: خانم معصومه مرتجایی</h3> <p><b>«نوع رابطه همزیستی موجودات زیر را مشخص کنید.»</b></p> <button class="start-btn" onclick="startGame()"> 🎮 شروع بازی </button> </div> <!-- صفحه سوال --> <div id="quizScreen" class="screen"> <h2 id="question"></h2> <button class="option" onclick="checkAnswer('همیاری')">همیاری</button> <button class="option" onclick="checkAnswer('همسفرگی')">همسفرگی</button> <button class="option" onclick="checkAnswer('انگلی')">انگلی</button> <p id="message"></p> </div> <!-- پایان بازی --> <div id="endScreen" class="screen"> <h1>🎉 پایان بازی 🎉</h1> <div id="score"></div> <div id="medal" class="medal"></div> <button class="start-btn" onclick="location.reload()"> بازی دوباره </button> </div> <script> const questions = [ { q:"مورچه و شته", a:"همیاری" }, { q:"زنبور و گل", a:"همیاری" }, { q:"میگوی تمیزکننده و کوسه", a:"همیاری" }, { q:"گلسنگ", a:"همیاری" }, { q:"باکتری روده و انسان", a:"همیاری" }, { q:"شیر و کفتار", a:"همسفرگی" }, { q:"ماهی کوچک و کوسه", a:"همسفرگی" }, { q:"لاک‌پشت و جلبک", a:"همسفرگی" }, { q:"کرمک و انسان", a:"انگلی" }, { q:"کنه و گاو", a:"انگلی" } ]; const praise = [ "🌟 عالی بود!", "👏 آفرین!", "🎉 درست گفتی!", "💯 فوق‌العاده!", "🏆 احسنت!" ]; let shuffled=[]; let current=0; let score=0; function shuffle(array){ for(let i=array.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [array[i],array[j]]=[array[j],array[i]]; } return array; } function startGame(){ document.getElementById("startScreen").classList.remove("active"); document.getElementById("quizScreen").classList.add("active"); shuffled=shuffle([...questions]); showQuestion(); } function showQuestion(){ document.getElementById("message").innerHTML=""; document.getElementById("question").innerHTML= (current+1)+" / "+shuffled.length+ "<br><br>"+shuffled[current].q; } function checkAnswer(ans){ if(ans===shuffled[current].a){ score++; document.getElementById("message").innerHTML= praise[Math.floor(Math.random()praise.length)]; launchConfetti(); setTimeout(()=>{ current++; if(current<shuffled.length){ showQuestion(); }else{ endGame(); } },1000); }else{ document.getElementById("message").innerHTML= "❌ پاسخ نادرست است، دوباره تلاش کنید."; } } function endGame(){ document.getElementById("quizScreen").classList.remove("active"); document.getElementById("endScreen").classList.add("active"); launchConfettiBig(); document.getElementById("score").innerHTML= "امتیاز شما: "+score+" از 10"; let medal=""; if(score>=8){ medal="🥇"; }else if(score>=5){ medal="🥈"; }else{ medal="🥉"; } document.getElementById("medal").innerHTML=medal; } / کاغذرنگی */ const canvas=document.getElementById("confetti"); const ctx=canvas.getContext("2d"); canvas.width=window.innerWidth; canvas.height=window.innerHeight; function confettiBurst(count){ let pieces=[]; for(let i=0;i<count;i++){ pieces.push({ x:Math.random()*canvas.width, y:0, size:5+Math.random()*8, speed:2+Math.random()*4, color:`hsl(${Math.random()*360},100%,50%)` }); } let frame=0; function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); pieces.forEach(p=>{ ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.
size,p.size); p.y+=p.speed; }); frame++; if(frame<80){ requestAnimationFrame(draw); }else{ ctx.clearRect(0,0,canvas.width,canvas.height); } } draw(); } function launchConfetti(){ confettiBurst(80); } function launchConfettiBig(){ confettiBurst(250); } </script> </body> </html>
