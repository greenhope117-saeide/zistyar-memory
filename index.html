```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>زیست‌یار | بازی همزیستی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Vazirmatn', sans-serif;
}

body {
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 900px;
  background: white;
  border-radius: 40px;
  padding: 35px;
  box-shadow: 0 25px 55px rgba(0,0,0,0.3);
  text-align: center;
}

.hidden {
  display: none !important;
}

h1 {
  font-size: 2.2rem;
  font-weight: 900;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

h2 {
  font-size: 1.2rem;
  font-weight: 600;
  color: #0f766e;
  margin-bottom: 10px;
}

.sampad-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}

.sampad-icon {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3a5f, #0f766e);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  overflow: hidden;
}

.sampad-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.school-name {
  font-size: 1.2rem;
  font-weight: 800;
  color: #1e3a5f;
  background: #e0f2fe;
  padding: 10px 25px;
  border-radius: 50px;
  display: inline-block;
}

.btn {
  width: 100%;
  padding: 18px;
  margin-top: 12px;
  font-size: 22px;
  font-weight: 800;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
  color: white;
  transition: 0.2s;
}

.btn:active {
  transform: scale(0.97);
}

.option {
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
}

.correct-effect {
  background: linear-gradient(135deg, #22c55e, #16a34a) !important;
}

.wrong-effect {
  background: linear-gradient(135deg, #ef4444, #dc2626) !important;
  animation: shake 0.3s ease-in-out 0s 2;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.message {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 20px 0;
  min-height: 80px;
  padding: 15px;
  border-radius: 60px;
  background: #f8fafc;
}

.question {
  font-size: 2rem;
  font-weight: 800;
  margin: 25px 0;
  background: #f1f5f9;
  padding: 25px;
  border-radius: 50px;
  line-height: 1.5;
}

.progress {
  display: inline-block;
  background: #e2e8f0;
  padding: 8px 20px;
  border-radius: 40px;
  font-weight: 700;
  margin-bottom: 15px;
}

.medal {
  font-size: 90px;
  margin-bottom: 20px;
}

.score-box {
  font-size: 1.3rem;
  font-weight: 800;
  background: #f1f5f9;
  padding: 12px;
  border-radius: 50px;
  margin-top: 15px;
}

.score-box span {
  color: #0f766e;
  font-size: 1.8rem;
}

@media (max-width: 700px) {
  .card {
    padding: 20px;
  }
  .question {
    font-size: 1.3rem;
    padding: 18px;
  }
  .btn {
    font-size: 1.1rem;
    padding: 14px;
  }
  .message {
    font-size: 1.1rem;
  }
  .sampad-icon {
    width: 80px;
    height: 80px;
  }
  .school-name {
    font-size: 0.9rem;
  }
}
</style>
</head>
<body>

<!-- صفحه شروع -->
<div id="startPage" class="card">
  <div class="sampad-logo">
    <div class="sampad-icon">
      <img src="sampad-logo.jpg" alt="سمپاد" onerror="this.parentElement.innerHTML='<div style=\"width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;\">🎓</div>'">
    </div>
    <div class="school-name">🏫 مدرسه فرزانگان ۱ شهریار</div>
  </div>
  <h1>🧬 زیست‌یار</h1>
  <h2>✨ طراح: خانم معصومه مرتجایی</h2>
  <br>
  <p style="font-size:1.2rem;">شرکت‌کننده گرامی<br><br>نوع رابطه همزیستی موجودات زیر را مشخص کنید.</p>
  <br><br>
  <button class="btn" id="startBtn">🎮 شروع بازی</button>
</div>

<!-- صفحه بازی -->
<div id="gamePage" class="card hidden">
  <div class="progress">📖 سؤال <span id="current">1</span> از <span id="total">10</span></div>
  <div id="msg" class="message"></div>
  <div id="question" class="question"></div>
  <button class="btn option" id="btn1" data-choice="همیاری">🤝 همیاری</button>
  <button class="btn option" id="btn2" data-choice="همسفرگی">🍽️ همسفرگی</button>
  <button class="btn option" id="btn3" data-choice="انگلی">🪱 انگلی</button>
  <div class="score-box">⭐ امتیاز: <span id="score">0</span></div>
</div>

<!-- صفحه پایان -->
<div id="finishPage" class="card hidden">
  <div id="medal" class="medal">🥇</div>
  <h1>🎉 پایان بازی</h1>
  <br>
  <p id="resultText" style="font-size:1.3rem;"></p>
  <br>
  <button class="btn" id="restartBtn">🔄 بازی دوباره</button>
</div>

<script>
// سوالات
const originalQuestions = [
  { text: "🐜 مورچه و شته 🐞", answer: "همیاری" },
  { text: "🐝 زنبور و گل 🌸", answer: "همیاری" },
  { text: "🦐 میگوی تمیزکننده و کوسه 🦈", answer: "همیاری" },
  { text: "🍄 گلسنگ (قارچ + جلبک) 🌿", answer: "همیاری" },
  { text: "🦠 باکتری روده و انسان 👤", answer: "همیاری" },
  { text: "🦁 شیر و کفتار 🐾", answer: "همسفرگی" },
  { text: "🐟 ماهی کوچک و کوسه 🦈", answer: "همسفرگی" },
  { text: "🐢 لاک‌پشت و جلبک 🪸", answer: "همسفرگی" },
  { text: "🪱 کرمک و انسان 👤", answer: "انگلی" },
  { text: "🕷️ کنه و گاو 🐄", answer: "انگلی" }
];

let shuffledQuestions = [];
let currentIndex = 0;
let currentScore = 0;
let waiting = false;
let answered = false;

const correctMsgs = ["آفرین ✨", "احسنت 🌟", "عالی بود 🎉"];
const wrongMsgs = ["دوباره فکر کن 💭", "دقت کن 🎯", "یک بار دیگر تلاش کن 🔄"];

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showQuestion() {
  if (currentIndex >= shuffledQuestions.length) {
    finishGame();
    return;
  }
  document.getElementById("current").textContent = currentIndex + 1;
  document.getElementById("question").innerHTML = shuffledQuestions[currentIndex].text;
  document.getElementById("msg").innerHTML = "";
  document.getElementById("msg").style.background = "#f8fafc";
  
  const btns = document.querySelectorAll("#gamePage .btn.option");
  btns.forEach(btn => {
    btn.disabled = false;
    btn.classList.remove("correct-effect", "wrong-effect");
  });
  
  waiting = false;
  answered = false;
}

function onAnswer(choice, btn) {
  if (waiting || answered) return;
  
  const correct = shuffledQuestions[currentIndex].answer;
  const msgDiv = document.getElementById("msg");
  
  waiting = true;
  answered = true;
  
  const btns = document.querySelectorAll("#gamePage .btn.option");
  btns.forEach(b => { b.disabled = true; });
  
  if (choice === correct) {
    const randomMsg = correctMsgs[Math.floor(Math.random() * correctMsgs.length)];
    msgDiv.innerHTML = `✅ ${randomMsg}`;
    msgDiv.style.background = "#dcfce7";
    msgDiv.style.color = "#16a34a";
    btn.classList.add("correct-effect");
    currentScore++;
    document.getElementById("score").textContent = currentScore;
    
    for(let i = 0; i < 50; i++) {
      const conf = document.createElement("div");
      conf.textContent = ["🎉", "✨", "🌟", "⭐"][Math.floor(Math.random()*4)];
      conf.style.position = "fixed";
      conf.style.left = Math.random() * 100 + "%";
      conf.style.top = "-30px";
      conf.style.fontSize = "20px";
      conf.style.pointerEvents = "none";
      conf.style.zIndex = "999";
      conf.style.animation = "fall 2s linear forwards";
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 2000);
    }
    
    setTimeout(() => {
      currentIndex++;
      showQuestion();
    }, 1000);
    
  } else {
    const randomMsg = wrongMsgs[Math.floor(Math.random() * wrongMsgs.length)];
    msgDiv.innerHTML = `❌ ${randomMsg}<br>📖 دوباره تلاش کن!`;
    msgDiv.style.background = "#fee2e2";
    msgDiv.style.color = "#dc2626";
    btn.classList.add("wrong-effect");
    
    setTimeout(() => {
      btn.classList.remove("wrong-effect");
      const allBtns = document.querySelectorAll("#gamePage .btn.option");
      allBtns.forEach(b => { b.disabled = false; });
      waiting = false;
      answered = false;
      setTimeout(() => {
        if (msgDiv.innerHTML.includes("❌")) {
          msgDiv.innerHTML = "";
          msgDiv.style.background = "#f8fafc";
        }
      }, 1000);
    }, 1000);
  }
}

function finishGame() {
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("finishPage").classList.remove("hidden");
  
  const total = shuffledQuestions.length;
  let medal = "🥉";
  let msg = "";
  
  if (currentScore === 10) {
    medal = "🥇";
    msg = "🎉🌟 آفرین! درس را عالی یاد گرفتی! 🌟🎉";
  } else if (currentScore >= 8) {
    medal = "🥈";
    msg = "👏 خیلی خوب! دانشت عالی است! 👏";
  } else if (currentScore >= 5) {
    medal = "🥉";
    msg = "👍 خوب بود! می‌توانی بهتر هم شوی! 👍";
  } else {
    medal = "🥉";
    msg = "💪 آفرین! بیشتر تلاش کن تا مطالب در یادت بماند! 💪";
  }
  
  document.getElementById("medal").textContent = medal;
  document.getElementById("resultText").innerHTML = `🌟 امتیاز شما: ${currentScore} از ${total}<br><br>${msg}`;
}

function startGame() {
  shuffledQuestions = shuffleArray([...originalQuestions]);
  currentIndex = 0;
  currentScore = 0;
  waiting = false;
  answered = false;
  
  document.getElementById("score").textContent = "0";
  document.getElementById("total").textContent = shuffledQuestions.length;
  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  showQuestion();
}

function restartGame() {
  shuffledQuestions = shuffleArray([...originalQuestions]);
  currentIndex = 0;
  currentScore = 0;
  waiting = false;
  answered = false;
  
  document.getElementById("score").textContent = "0";
  document.getElementById("total").textContent = shuffledQuestions.length;
  document.getElementById("finishPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  showQuestion();
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", restartGame);
document.getElementById("btn1").addEventListener("click", function() { onAnswer("همیاری", this); });
document.getElementById("btn2").addEventListener("click", function() { onAnswer("همسفرگی", this); });
document.getElementById("btn3").addEventListener("click", function() { onAnswer("انگلی", this); });

const style = document.createElement('style');
style.textContent = `
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }
`;
document.head.appendChild(style);
</script>
</body>
</html>
