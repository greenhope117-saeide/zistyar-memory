<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>زیست‌یار | بازی همزیستی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: 'Vazirmatn', sans-serif;
}

.card {
  background: white;
  max-width: 650px;
  width: 100%;
  border-radius: 35px;
  padding: 30px 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.hidden {
  display: none;
}

.school-name {
  background: #e0f2fe;
  padding: 8px 20px;
  border-radius: 50px;
  display: inline-block;
  font-weight: 700;
  margin-bottom: 20px;
  font-size: 0.9rem;
  color: #1e3a5f;
}

h1 {
  font-size: 2rem;
  margin-bottom: 10px;
  color: #0b1f3a;
}

.designer {
  color: #0f766e;
  margin-bottom: 20px;
  font-size: 0.9rem;
}

.btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  border: none;
  border-radius: 35px;
  cursor: pointer;
  background: #0ea5e9;
  color: white;
  transition: 0.1s;
}

.btn:active {
  transform: scale(0.97);
}

.option {
  background: #0ea5e9;
}

.correct-glow {
  background: #22c55e !important;
}

.wrong-glow {
  background: #ef4444 !important;
  animation: shake 0.2s ease-in-out 2;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.msg-box {
  background: #f1f5f9;
  border-radius: 40px;
  padding: 14px;
  margin: 15px 0;
  min-height: 75px;
  font-weight: 600;
}

.question-box {
  background: #f1f5f9;
  border-radius: 35px;
  padding: 20px;
  margin: 15px 0;
  font-size: 1.5rem;
  font-weight: 800;
}

.progress {
  background: #e2e8f0;
  display: inline-block;
  padding: 5px 18px;
  border-radius: 30px;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.score-box {
  background: #f1f5f9;
  padding: 10px;
  border-radius: 40px;
  margin-top: 15px;
  font-weight: 700;
}

.score-number {
  color: #0f766e;
  font-size: 1.6rem;
  font-weight: 800;
}

.medal {
  font-size: 75px;
  margin-bottom: 10px;
}

/* دکمه موسیقی */
.music-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  backdrop-filter: blur(5px);
  z-index: 1000;
  transition: 0.2s;
}

.music-btn:hover {
  background: rgba(255,255,255,0.5);
  transform: scale(1.05);
}

@media (max-width: 550px) {
  .card { padding: 20px; }
  .question-box { font-size: 1.2rem; }
  .btn { font-size: 1rem; }
  .music-btn {
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    bottom: 15px;
    left: 15px;
  }
}
</style>
</head>
<body>

<!-- دکمه کنترل موسیقی -->
<button class="music-btn" id="musicToggleBtn">🔇</button>

<!-- صفحه شروع -->
<div id="startPage" class="card">
  <div class="school-name">🏫 مدرسه فرزانگان ۱ شهریار</div>
  <h1>زیست‌یار</h1>
  <div class="designer">✨ طراح: خانم معصومه مرتجایی</div>
  <p>شرکت‌کننده گرامی</p>
  <p style="margin: 10px 0 20px;">نوع رابطه همزیستی موجودات زیر را مشخص کنید.</p>
  <button class="btn" id="startBtn">شروع بازی</button>
</div>

<!-- صفحه بازی -->
<div id="gamePage" class="card hidden">
  <div class="progress">سوال <span id="qNum">1</span> از <span id="totalQ">10</span></div>
  <div id="msgBox" class="msg-box"></div>
  <div id="questionText" class="question-box"></div>
  <button class="btn option" id="btn1">🤝 همیاری</button>
  <button class="btn option" id="btn2">🍽️ همسفرگی</button>
  <button class="btn option" id="btn3">🪱 انگلی</button>
  <div class="score-box">⭐ امتیاز: <span id="scoreVal" class="score-number">0</span></div>
</div>

<!-- صفحه پایان -->
<div id="endPage" class="card hidden">
  <div id="medalIcon" class="medal">🏆</div>
  <h1>پایان بازی</h1>
  <p id="endMsg" style="margin: 15px 0;"></p>
  <button class="btn" id="restartBtn">بازی دوباره</button>
</div>

<script>
// ========== موسیقی پس زمینه (بی‌کلام و ملایم) ==========
let audioContext = null;
let musicSource = null;
let musicGain = null;
let isMusicPlaying = false;

// نت‌های ساده و ملایم (گام دو ماژور آرام)
const melodyNotes = [
  261.63, 293.66, 329.63, 261.63,  // C4, D4, E4, C4
  329.63, 293.66, 261.63, 392.00,  // E4, D4, C4, G4
  261.63, 329.63, 293.66, 261.63,  // C4, E4, D4, C4
  293.66, 329.63, 392.00, 349.23   // D4, E4, G4, F4
];

const melodyDurations = [
  0.5, 0.5, 0.5, 0.5,
  0.5, 0.5, 1.0, 0.5,
  0.5, 0.5, 0.5, 0.5,
  0.5, 0.5, 1.0, 1.0
];

let currentNoteIndex = 0;
let scheduledTime = 0;
let isMusicLooping = false;

function initAudio() {
  if (audioContext) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  musicGain = audioContext.createGain();
  musicGain.gain.value = 0.15;  // صدای ملایم
  musicGain.connect(audioContext.destination);
}

function playNextNote() {
  if (!isMusicLooping || !audioContext) return;
  
  const now = audioContext.currentTime;
  const note = melodyNotes[currentNoteIndex];
  const duration = melodyDurations[currentNoteIndex];
  
  const osc = audioContext.createOscillator();
  osc.type = 'sine';  // صدای نرم و ملایم
  osc.frequency.value = note;
  
  const noteGain = audioContext.createGain();
  noteGain.gain.value = 0.12;
  
  osc.connect(noteGain);
  noteGain.connect(musicGain);
  
  osc.start(now);
  noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.stop(now + duration);
  
  currentNoteIndex = (currentNoteIndex + 1) % melodyNotes.length;
  
  // زمان نت بعدی
  const nextTime = now + duration;
  const timeUntilNext = Math.max(0, (nextTime - audioContext.currentTime)) * 1000;
  setTimeout(playNextNote, timeUntilNext);
}

function startMusic() {
  if (!audioContext) {
    initAudio();
  }
  if (audioContext.state === 'suspended') {
    audioContext.resume().then(() => {
      isMusicLooping = true;
      currentNoteIndex = 0;
      playNextNote();
      isMusicPlaying = true;
      document.getElementById("musicToggleBtn").innerHTML = "🎵";
    });
  } else if (!isMusicLooping) {
    isMusicLooping = true;
    currentNoteIndex = 0;
    playNextNote();
    isMusicPlaying = true;
    document.getElementById("musicToggleBtn").innerHTML = "🎵";
  }
}

function stopMusic() {
  isMusicLooping = false;
  isMusicPlaying = false;
  document.getElementById("musicToggleBtn").innerHTML = "🔇";
}

function toggleMusic() {
  if (isMusicPlaying) {
    stopMusic();
  } else {
    startMusic();
  }
}

// فعال کردن موسیقی با اولین کلیک کاربر (به دلیل محدودیت مرورگرها)
function enableMusicOnFirstInteraction() {
  if (!isMusicPlaying && audioContext && audioContext.state === 'suspended') {
    startMusic();
  }
  document.removeEventListener('click', enableMusicOnFirstInteraction);
  document.removeEventListener('touchstart', enableMusicOnFirstInteraction);
}

// ========== منطق بازی ==========
const questionsList = [
  { text: "🐜 مورچه و شته 🐞", answer: "همیاری" },
  { text: "🐝 زنبور و گل 🌸", answer: "همیاری" },
  { text: "🦐 میگوی تمیزکننده و کوسه 🦈", answer: "همیاری" },
  { text: "🍄 گلسنگ (قارچ + جلبک) 🌿", answer: "همیاری" },
  { text: "🦠 باکتری روده و انسان 👤", answer: "همیاری" },
  { text: "🦁 شیر و کفتار 🐾", answer: "همسفرگی" },
  { text: "🐟 ماهی کوچک و کوسه 🦈", answer: "همسفرگی" },
  { text: "🐢 لاک‌پشت و جلبک 🪸", answer: "همسفرگی" },
  { text: "🪱 کرمک و انسان 👤", answer: "انگلی" },
  { text: "🕷️ کنه و گاو 🐄", answer: "انگلی" }
];

let shuffled = [];
let currentIndex = 0;
let totalScore = 0;
let waiting = false;
let questionLocked = false;

const goodMsgs = ["آفرین ✨", "احسنت 🌟", "عالی بود 🎉"];
const badMsgs = ["دوباره فکر کن 💭", "دقت کن 🎯", "یک بار دیگر تلاش کن 🔄"];

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showConfetti() {
  for (let i = 0; i < 35; i++) {
    const el = document.createElement("div");
    el.innerText = ["🎉", "✨", "🌟", "⭐"][Math.floor(Math.random() * 4)];
    el.style.position = "fixed";
    el.style.left = Math.random() * 100 + "%";
    el.style.top = "-30px";
    el.style.fontSize = (16 + Math.random() * 14) + "px";
    el.style.pointerEvents = "none";
    el.style.zIndex = "9999";
    el.style.transition = "all 2s ease-out";
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transform = `translateY(${window.innerHeight + 50}px) rotate(${Math.random() * 360}deg)`;
      el.style.opacity = "0";
    });
    setTimeout(() => el.remove(), 2000);
  }
}

function showQuestion() {
  if (currentIndex >= shuffled.length) {
    finishGame();
    return;
  }

  document.getElementById("qNum").innerText = currentIndex + 1;
  document.getElementById("questionText").innerHTML = shuffled[currentIndex].text;

  const msgDiv = document.getElementById("msgBox");
  msgDiv.innerHTML = "";
  msgDiv.style.background = "#f1f5f9";
  msgDiv.style.color = "#1e293b";

  document.getElementById("btn1").disabled = false;
  document.getElementById("btn2").disabled = false;
  document.getElementById("btn3").disabled = false;

  document.getElementById("btn1").classList.remove("correct-glow", "wrong-glow");
  document.getElementById("btn2").classList.remove("correct-glow", "wrong-glow");
  document.getElementById("btn3").classList.remove("correct-glow", "wrong-glow");

  waiting = false;
  questionLocked = false;
}

function onAnswer(selected, btn) {
  if (waiting) return;

  const correctAns = shuffled[currentIndex].answer;
  const msgDiv = document.getElementById("msgBox");

  waiting = true;

  document.getElementById("btn1").disabled = true;
  document.getElementById("btn2").disabled = true;
  document.getElementById("btn3").disabled = true;

  if (selected === correctAns) {
    if (!questionLocked) {
      totalScore++;
      document.getElementById("scoreVal").innerText = totalScore;
    }

    const goodMsg = goodMsgs[Math.floor(Math.random() * goodMsgs.length)];
    msgDiv.innerHTML = `✅ ${goodMsg}`;
    msgDiv.style.background = "#dcfce7";
    msgDiv.style.color = "#166534";

    btn.classList.add("correct-glow");
    showConfetti();

    setTimeout(() => {
      btn.classList.remove("correct-glow");
      currentIndex++;
      showQuestion();
    }, 900);

  } else {
    const badMsg = badMsgs[Math.floor(Math.random() * badMsgs.length)];
    msgDiv.innerHTML = `❌ ${badMsg}<br>📖 دوباره تلاش کن!`;
    msgDiv.style.background = "#fee2e2";
    msgDiv.style.color = "#991b1b";

    btn.classList.add("wrong-glow");

    if (!questionLocked) {
      questionLocked = true;
      totalScore--;
      document.getElementById("scoreVal").innerText = totalScore;
    }

    setTimeout(() => {
      btn.classList.remove("wrong-glow");

      document.getElementById("btn1").disabled = false;
      document.getElementById("btn2").disabled = false;
      document.getElementById("btn3").disabled = false;
      waiting = false;

      setTimeout(() => {
        if (msgDiv.innerHTML.includes("❌")) {
          msgDiv.innerHTML = "";
          msgDiv.style.background = "#f1f5f9";
        }
      }, 1300);
    }, 900);
  }
}

function finishGame() {
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("endPage").classList.remove("hidden");

  const total = shuffled.length;
  let medal = "🏆";
  let message = "";

  if (totalScore === 10) {
    medal = "🥇";
    message = "🎉🌟 عالی! همه رو درست جواب دادی! 🌟🎉";
  } else if (totalScore >= 8) {
    medal = "🥈";
    message = "👏 خیلی خوب! دانشت عالی است! 👏";
  } else if (totalScore >= 5) {
    medal = "🥉";
    message = "👍 خوب بود! می‌توانی بهتر هم شوی! 👍";
  } else {
    medal = "🌱";
    message = "💪 آفرین! بیشتر تلاش کن تا مطالب در یادت بماند! 💪";
  }

  document.getElementById("medalIcon").innerHTML = medal;
  document.getElementById("endMsg").innerHTML = `🌟 امتیاز شما: ${totalScore} از ${total}<br><br>${message}`;
}

function startGame() {
  shuffled = shuffleArray([...questionsList]);
  currentIndex = 0;
  totalScore = 0;
  waiting = false;
  questionLocked = false;

  document.getElementById("scoreVal").innerText = "0";
  document.getElementById("totalQ").innerText = shuffled.length;

  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("endPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  showQuestion();
}

// راه‌اندازی
document.getElementById("startBtn").onclick = () => {
  startGame();
  enableMusicOnFirstInteraction();
};
document.getElementById("restartBtn").onclick = () => {
  startGame();
  enableMusicOnFirstInteraction();
};
document.getElementById("btn1").onclick = () => onAnswer("همیاری", document.getElementById("btn1"));
document.getElementById("btn2").onclick = () => onAnswer("همسفرگی", document.getElementById("btn2"));
document.getElementById("btn3").onclick = () => onAnswer("انگلی", document.getElementById("btn3"));

document.getElementById("musicToggleBtn").onclick = toggleMusic;

// آماده‌سازی صدا
initAudio();
document.addEventListener('click', enableMusicOnFirstInteraction);
document.addEventListener('touchstart', enableMusicOnFirstInteraction);
</script>
</body>
</html>
