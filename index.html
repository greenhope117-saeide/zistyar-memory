```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زیست‌یار</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{
background:linear-gradient(135deg,#0b1f3a,#0f766e);
min-height:100vh;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:900px;
background:white;
color:#111;
border-radius:30px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
text-align:center;
}

.hidden{
display:none;
}

h1{
margin-bottom:15px;
}

h2{
margin-bottom:10px;
}

.btn{
width:100%;
padding:18px;
margin-top:12px;
font-size:22px;
border:none;
border-radius:16px;
cursor:pointer;
transition:.3s;
font-weight:700;
}

.btn:hover{
transform:scale(1.03);
}

.option{
background:#0ea5e9;
color:white;
}

.option:hover{
background:#0284c7;
}

.correct{
background:#22c55e !important;
}

.wrong{
background:#ef4444 !important;
}

.message{
font-size:26px;
font-weight:800;
margin:20px 0;
min-height:45px;
}

.progress{
margin-top:10px;
font-size:20px;
}

.question{
font-size:38px;
font-weight:800;
margin:30px 0;
}

.medal{
font-size:90px;
margin-bottom:20px;
}

.dna{
font-size:70px;
opacity:.15;
position:fixed;
animation:float 8s infinite alternate;
}

.dna1{
top:10%;
left:5%;
}

.dna2{
bottom:10%;
right:5%;
}

@keyframes float{
from{transform:translateY(0)}
to{transform:translateY(-40px)}
}

@media(max-width:700px){

.question{
font-size:28px;
}

.btn{
font-size:20px;
}

}
</style>
</head>

<body>

<div class="dna dna1">🧬</div>
<div class="dna dna2">🧬</div>

<!-- صفحه شروع -->

<div id="startPage" class="card">

<h1>🧬 زیست‌یار</h1>

<h2>✨ طراح: خانم معصومه مرتجایی</h2>

<br>

<p style="font-size:22px">
شرکت‌کننده گرامی
<br><br>
نوع رابطه همزیستی موجودات زیر را مشخص کنید.
</p>

<br><br>

<button class="btn option" onclick="startGame()">
🎮 شروع بازی
</button>

</div>

<!-- صفحه بازی -->

<div id="gamePage" class="card hidden">

<div class="progress">
سؤال <span id="current">1</span> از 10
</div>

<div id="msg" class="message"></div>

<div id="question" class="question"></div>

<button class="btn option" onclick="answer('همیاری',this)">
🤝 همیاری
</button>

<button class="btn option" onclick="answer('همسفرگی',this)">
🍽️ همسفرگی
</button>

<button class="btn option" onclick="answer('انگلی',this)">
🪱 انگلی
</button>

<br><br>

<div style="font-size:22px">
⭐ امتیاز:
<span id="score">0</span>
</div>

</div>

<!-- پایان -->

<div id="finishPage" class="card hidden">

<div id="medal" class="medal">🥇</div>

<h1>🎉 تبریک</h1>

<br>

<p id="resultText" style="font-size:24px"></p>

<br>

<h2>✨ طراح: خانم معصومه مرتجایی</h2>

</div>

<script>

const questions=[

["مورچه و شته","همیاری"],
["زنبور و گل","همیاری"],
["میگوی تمیزکننده و کوسه","همیاری"],
["گلسنگ","همیاری"],
["باکتری روده و انسان","همیاری"],
["شیر و کفتار","همسفرگی"],
["ماهی کوچک و کوسه","همسفرگی"],
["لاک‌پشت و جلبک","همسفرگی"],
["کرمک و انسان","انگلی"],
["کنه و گاو","انگلی"]

];

let index=0;
let score=0;

function startGame(){

document.getElementById("startPage").classList.add("hidden");
document.getElementById("gamePage").classList.remove("hidden");

showQuestion();

}

function showQuestion(){

document.getElementById("current").textContent=index+1;
document.getElementById("question").textContent=
questions[index][0];

document.getElementById("msg").textContent="";

}

function answer(choice,btn){

const correct=questions[index][1];

if(choice===correct){

const praise=[
"🌟 آفرین",
"👏 احسنت",
"🎉 عالی بود",
"⭐ بسیار خوب",
"🏆 درست است"
];

document.getElementById("msg").style.color="#16a34a";

document.getElementById("msg").textContent=
praise[Math.floor(Math.random()*praise.length)];

btn.classList.add("correct");

score++;

document.getElementById("score").textContent=score;

setTimeout(()=>{

btn.classList.remove("correct");

index++;

if(index>=questions.length){

finishGame();

}else{

showQuestion();

}

},1000);

}else{

document.getElementById("msg").style.color="#dc2626";

document.getElementById("msg").textContent=
"❌ متأسفم، اشتباه بود. دوباره تلاش کن.";

btn.classList.add("wrong");

setTimeout(()=>{

btn.classList.remove("wrong");

},800);

}

}

function finishGame(){

document.getElementById("gamePage")
.classList.add("hidden");

document.getElementById("finishPage")
.classList.remove("hidden");

let medal="🥉";

if(score>=7) medal="🥈";

if(score===10) medal="🥇";

document.getElementById("medal").textContent=medal;

document.getElementById("resultText").innerHTML=

"🌟 شما موفق شدید "
+
score
+
" امتیاز از 10 کسب کنید."
+
"<br><br>"
+
"روابط همزیستی را با موفقیت بررسی کردید.";

}

</script>

</body>
</html>
```
