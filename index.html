<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زیست‌یار - همزیستی</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#dff9fb,#c7ecee);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:hidden;
}

.container{
background:white;
width:100%;
max-width:700px;
padding:25px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
text-align:center;
position:relative;
}

h1{
color:#2d3436;
margin-bottom:10px;
}

.designer{
color:#636e72;
margin-bottom:20px;
font-size:14px;
}

.progress{
margin-bottom:20px;
font-weight:bold;
color:#0984e3;
}

.question{
font-size:24px;
line-height:1.8;
margin-bottom:25px;
color:#2d3436;
}

.btn{
display:block;
width:100%;
margin:10px 0;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.3s;
background:#74b9ff;
color:white;
}

.btn:hover{
transform:scale(1.03);
background:#0984e3;
}

.message{
margin-top:15px;
font-size:20px;
font-weight:bold;
color:#27ae60;
min-height:40px;
}

.result{
display:none;
}

.medal{
font-size:90px;
margin:20px 0;
}

.score{
font-size:28px;
margin:10px;
}

.again{
background:#00b894;
}

.confetti{
position:fixed;
width:12px;
height:12px;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

@media(max-width:600px){

.question{
font-size:20px;
}

.btn{
font-size:16px;
padding:14px;
}

}
</style>
</head>

<body>

<div class="container">

<div id="game">

<h1>زیست‌یار</h1>
<div class="designer">طراح: خانم معصومه مرتجایی</div>

<div class="progress" id="progress"></div>

<div class="question" id="question"></div>

<button class="btn" onclick="checkAnswer('همیاری')">همیاری</button>
<button class="btn" onclick="checkAnswer('همسفرگی')">همسفرگی</button>
<button class="btn" onclick="checkAnswer('انگلی')">انگلی</button>

<div class="message" id="message"></div>

</div>

<div class="result" id="result">
<h1>پایان بازی</h1>

<div class="medal" id="medal"></div>

<div class="score" id="finalScore"></div>

<button class="btn again" onclick="location.reload()">
بازی دوباره
</button>
</div>

</div>

<script>

let questions = [

{
q:"زنبور و گل از یکدیگر سود می‌برند.",
a:"همیاری"
},

{
q:"ماهی بادکنکی کنار خیار دریایی زندگی می‌کند و فقط ماهی سود می‌برد.",
a:"همسفرگی"
},

{
q:"کرم کدو در روده انسان زندگی می‌کند.",
a:"انگلی"
},

{
q:"گاو و باکتری‌های شکمبه هر دو سود می‌برند.",
a:"همیاری"
},

{
q:"ماهی ریمورا به کوسه می‌چسبد و از باقی‌مانده غذا استفاده می‌کند.",
a:"همسفرگی"
},

{
q:"شپش روی بدن انسان زندگی می‌کند.",
a:"انگلی"
},

{
q:"قارچ و جلبک در گلسنگ با هم همکاری دارند.",
a:"همیاری"
},

{
q:"پرنده روی درخت لانه می‌سازد و درخت آسیب نمی‌بیند.",
a:"همسفرگی"
},

{
q:"کنه از خون بدن جانوران تغذیه می‌کند.",
a:"انگلی"
},

{
q:"خرچنگ و شقایق دریایی هر دو از حضور یکدیگر سود می‌برند.",
a:"همیاری"
}

];

questions.sort(()=>Math.random()-0.5);

const messages = [
"آفرین 🌟",
"بسیار عالی 👏",
"درست گفتی 🎉",
"احسنت 💎",
"عالی بود 🌈",
"آفرین دانشمند کوچولو 🧠"
];

let current=0;
let score=0;

const questionEl=document.getElementById("question");
const progressEl=document.getElementById("progress");
const messageEl=document.getElementById("message");

function loadQuestion(){

messageEl.innerHTML="";

progressEl.innerHTML=
`سؤال ${current+1} از ${questions.length}`;

questionEl.innerHTML=
questions[current].q;

}

function checkAnswer(answer){

if(answer===questions[current].a){

score++;

messageEl.innerHTML=
messages[Math.floor(Math.random()*messages.length)];

createConfetti(60);

setTimeout(()=>{

current++;

if(current<questions.length){
loadQuestion();
}else{
showResult();
}

},1200);

}else{

messageEl.style.color="#e74c3c";
messageEl.innerHTML="❌ دوباره تلاش کن";

setTimeout(()=>{
messageEl.style.color="#27ae60";
},1000);

}

}

function showResult(){

document.getElementById("game").style.display="none";
document.getElementById("result").style.display="block";

let medal="🥉";
let title="مدال برنز";

if(score>=8){
medal="🥇";
title="مدال طلا";
}
else if(score>=5){
medal="🥈";
title="مدال نقره";
}

document.getElementById("medal").innerHTML=medal;

document.getElementById("finalScore").innerHTML=
`${title}<br><br>امتیاز: ${score} از ${questions.length}`;

createConfetti(300);

}

function createConfetti(count){

const colors=[
"#ff7675",
"#fdcb6e",
"#55efc4",
"#74b9ff",
"#a29bfe",
"#e84393"
];

for(let i=0;i<count;i++){

const c=document.createElement("div");

c.classList.add("confetti");

c.style.background=
colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=
(2+Math.random()*3)+"s";

c.style.width=(8+Math.random()*10)+"px";
c.style.height=(8+Math.random()*10)+"px";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},5000);

}

}

loadQuestion();

</script>

</body>
</html>
