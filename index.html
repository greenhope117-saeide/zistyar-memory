.hidden {

}

h1 {

  color: transparent;

@keyframes glowPulse {
  0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); }

  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  background: linear-gradient(135deg, #0ea5e9, #0284c7);

.btn::before {

  top: 50%;
  left: 50%;
  width: 0;

  transform: translate(-50%, -50%);

.btn:active::before {
  width: 300px;

.btn:active {

.btn:hover {
  transform: translateY(-3px);

.correct-effect {

}

.wrong-effect {
  background: linear-gradient(135deg, #ef4444, #dc2626) !important;
  box-shadow: 0 0 0 4px #fecaca, 0 0 20px #ef4444 !important;
  animation: shake 0.3s ease-in-out 0s 2;
  transition: 0.1s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.message {
  font-size: 26px;
  font-weight: 800;
  margin: 20px 0;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  background: #f8fafc;
  border-radius: 60px;
  padding: 15px;
  font-weight: 700;
  transition: all 0.3s;
}

/* نوار پیشرفت */
.progress-container {
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.progress-text {
  font-size: 1rem;
  font-weight: 700;
  background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
  padding: 8px 20px;
  border-radius: 40px;
  color: #0f172a;
}

.progress-bar-wrapper {
  flex: 1;
  height: 12px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #0ea5e9, #22c55e);
  width: 0%;

  transition: width 0.5s ease;
}

.question {
  font-size: 2rem;
  font-weight: 800;
  margin: 25px 0;
  background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
  padding: 30px;
  border-radius: 50px;
  line-height: 1.5;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.1);
  letter-spacing: 1px;
}

.medal {
  font-size: 100px;
  margin-bottom: 20px;
  animation: medalSpin 0.8s ease-out, bounce 0.6s ease;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,0.2));
}

@keyframes medalSpin {
  0% { transform: rotate(-180deg) scale(0); opacity: 0; }
  100% { transform: rotate(0deg) scale(1); opacity: 1; }
}

.dna-bg {
  font-size: 85px;
  opacity: 0.1;
  position: fixed;
  animation: floatSlow 10s infinite alternate;
  pointer-events: none;
}

.dna1 {
  top: 10%;
  left: 3%;
}

.dna2 {
  bottom: 10%;
  right: 3%;
}

@keyframes floatSlow {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-50px) rotate(8deg); }
}

@keyframes bounce {
  0% { transform: scale(0.7); opacity: 0; }
  70% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

.confetti {
  position: fixed;
  width: 12px;
  height: 12px;
  position: absolute;
  animation: fall 2.2s linear forwards;
  z-index: 999;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(400deg);
    opacity: 0;
  }
}

/* افکت شمارش معکوس */
.countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 5rem;
  font-weight: 900;
  color: white;
  background: rgba(0,0,0,0.7);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: countdownPulse 0.8s ease-out;
  pointer-events: none;
}

@keyframes countdownPulse {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@media (max-width: 700px) {
  .question {
    font-size: 1.3rem;
    padding: 20px;
  }
  .btn {
    font-size: 1.1rem;
    padding: 14px;
  }
  .message {
    font-size: 1rem;
  }
  .card {
    padding: 20px;
  }
  .sampad-icon {
    width: 80px;
    height: 80px;
  }
  .school-name {
    font-size: 0.85rem;
  }
  .progress-container {
    flex-direction: column;
  }
  .countdown {
    font-size: 3rem;
    width: 70px;
    height: 70px;
  }
}
</style>
</head>
<body>

<div class="dna-bg dna1">🧬</div>
<div class="dna-bg dna2">🧬</div>

<!-- صفحه شروع -->
<div id="startPage" class="card">
  <div class="sampad-logo">
    <div class="sampad-icon">
      <img src="sampad-logo.png" alt="سمپاد" onerror="this.src='https://placehold.co/100x100/1e3a5f/ffd700?text=🎓'">
    </div>
    <div class="school-name">🏫 مدرسه فرزانگان ۱ شهریار</div>
  </div>
  
  <h1>🧬 زیست‌یار</h1>
  <h2>✨ طراح: خانم معصومه مرتجایی</h2>
  <br>
  <p style="font-size:1.2rem; font-weight:500; color:#334155;">
    🌿 شرکت‌کننده گرامی
    <br><br>
    نوع رابطه همزیستی موجودات زیر را مشخص کنید.
  </p>
  <br><br>
  <button class="btn" id="startBtn">
    <i class="fas fa-play"></i> شروع بازی
  </button>
</div>

<!-- صفحه بازی -->
<div id="gamePage" class="card hidden">
  <div class="progress-container">
    <div class="progress-text">📖 سؤال <span id="current">1</span> از <span id="total">10</span></div>
    <div class="progress-bar-wrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
  <div id="msg" class="message"></div>
  <div id="question" class="question"></div>
  <button class="btn option" data-choice="همیاری">
    <i class="fas fa-handshake"></i> 🤝 همیاری
  </button>
  <button class="btn option" data-choice="همسفرگی">
    <i class="fas fa-fish"></i> 🍽️ همسفرگی
  </button>
  <button class="btn option" data-choice="انگلی">
    <i class="fas fa-bug"></i> 🪱 انگلی
  </button>
  <br><br>
  <div style="font-size:1.3rem; font-weight:800; background:#f1f5f9; padding:12px; border-radius:50px;">
    ⭐ امتیاز: <span id="score" style="color:#0f766e; font-size:1.8rem;">0</span>
  </div>
</div>

<!-- صفحه پایان -->
<div id="finishPage" class="card hidden">
  <div id="medal" class="medal">🥇</div>
  <h1>🎉 پایان بازی</h1>
  <br>
  <p id="resultText" style="font-size:1.3rem; font-weight:500; line-height:2;"></p>
  <br>
  <button class="btn" id="restartBtn">
    <i class="fas fa-redo-alt"></i> بازی دوباره
  </button>
</div>

<script>
const originalQuestions = [
  { text: "🐜 مورچه و شته 🐞", answer: "همیاری" },
  { text: "🐝 زنبور و گل 🌸", answer: "همیاری" },
  { text: "🦐 میگوی تمیزکننده و کوسه 🦈", answer: "همیاری" },
  { text: "🍄 گلسنگ (قارچ + جلبک) 🌿", answer: "همیاری" },
  { text: "🦠 باکتری روده و انسان 👤", answer: "همیاری" },
  { text: "🦁 شیر و کفتار 🐾", answer: "همسفرگی" },
  { text: "🐟 ماهی کوچک و کوسه 🦈", answer: "همسفرگی" },
  { text: "🐢 لاک‌پشت و جلبک 🪸", answer: "همسفرگی" },
  { text: "🪱 کرمک و انسان 👤", answer: "انگلی" },
  { text: "🕷️ کنه و گاو 🐄", answer: "انگلی" }
];

let shuffledQuestions = [];
let currentIndex = 0;
let currentScore = 0;
let waitingForNext = false;
let currentButtons = [];

const correctMessages = ["آفرین ✨", "احسنت 🌟", "عالی بود 🎉"];
const wrongMessages = ["دوباره فکر کن 💭", "دقت کن 🎯", "یک بار دیگر تلاش کن 🔄", "کمی بیشتر فکر کن 🤔"];

function createConfetti() {
  for (let i = 0; i < 80; i++) {
    const conf = document.createElement("div");
    conf.classList.add("confetti");
    const colors = ["#fbbf24", "#34d399", "#f87171", "#60a5fa", "#c084fc", "#f472b6", "#fb923c", "#a855f7"];
    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    conf.style.left = Math.random() * 100 + "%";
    conf.style.width = Math.random() * 14 + 6 + "px";
    conf.style.height = Math.random() * 14 + 6 + "px";
    conf.style.position = "fixed";
    conf.style.top = "-20px";
    conf.style.borderRadius = "50%";
    conf.style.opacity = "0.9";
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 2200);
  }
}

function showCountdown(callback) {
  let count = 3;
  const countdownDiv = document.createElement('div');
  countdownDiv.className = 'countdown';
  document.body.appendChild(countdownDiv);
  
  const interval = setInterval(() => {
    countdownDiv.textContent = count;
    count--;
    if (count < 0) {
      clearInterval(interval);
      countdownDiv.remove();
      if (callback) callback();
    }
  }, 400);
}

function updateProgressBar() {
  const percent = ((currentIndex) / shuffledQuestions.length) * 100;
  document.getElementById('progressBar').style.width = percent + '%';
}

function loadCurrentQuestion() {
  if (currentIndex >= shuffledQuestions.length) {
    finishGame();
    return;
  }
  document.getElementById("current").textContent = currentIndex + 1;
  const qData = shuffledQuestions[currentIndex];
  document.getElementById("question").innerHTML = qData.text;
  updateProgressBar();
  
  const msgDiv = document.getElementById("msg");
  msgDiv.innerHTML = "";
  msgDiv.style.color = "#111";
  msgDiv.style.background = "#f8fafc";
  
  currentButtons.forEach(btn => {
    btn.classList.remove("correct-effect", "wrong-effect");
    btn.disabled = false;
  });
  waitingForNext = false;
}

function onAnswer(choice, btnElement) {
  if (waitingForNext) return;
  if (!shuffledQuestions[currentIndex]) return;

  const correctAnswer = shuffledQuestions[currentIndex].answer;
  const msgDiv = document.getElementById("msg");

  waitingForNext = true;
  currentButtons.forEach(btn => { btn.disabled = true; });

  if (choice === correctAnswer) {
    createConfetti();
    
    const randomMsg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
    msgDiv.innerHTML = `✅ ${randomMsg}`;
    msgDiv.style.color = "#16a34a";
    msgDiv.style.background = "#dcfce7";
    
    btnElement.classList.add("correct-effect");
    currentScore++;
    document.getElementById("score").textContent = currentScore;
    
    showCountdown(() => {
      btnElement.classList.remove("correct-effect");
      currentIndex++;
      if (currentIndex >= shuffledQuestions.length) {
        finishGame();
      } else {
        loadCurrentQuestion();
      }
    });
    
  } else {
    const randomMsg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];
    msgDiv.innerHTML = `❌ ${randomMsg}<br>📖 سوال را دوباره بخوان و تلاش کن!`;
    msgDiv.style.color = "#dc2626";
    msgDiv.style.background = "#fee2e2";
    
    btnElement.classList.add("wrong-effect");
    
    setTimeout(() => {
      btnElement.classList.remove("wrong-effect");
      currentButtons.forEach(btn => { btn.disabled = false; });
      waitingForNext = false;
      setTimeout(() => {
        if (msgDiv.innerHTML.includes("❌")) {
          msgDiv.innerHTML = "";
          msgDiv.style.background = "#f8fafc";
        }
      }, 1500);
    }, 1200);
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initGame() {
  shuffledQuestions = shuffleArray([...originalQuestions]);
  currentIndex = 0;
  currentScore = 0;
  waitingForNext = false;
  
  document.getElementById("score").textContent = "0";
  document.getElementById("total").textContent = shuffledQuestions.length;
  document.getElementById('progressBar').style.width = '0%';
  
  const btns = document.querySelectorAll("#gamePage .btn.option");
  currentButtons = [];
  
  btns.forEach(btn => {
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    
    const choice = newBtn.getAttribute("data-choice");
    if (choice) {
      newBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        onAnswer(choice, newBtn);
      });
      currentButtons.push(newBtn);
    }
  });
  
  loadCurrentQuestion();
}

function finishGame() {
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("finishPage").classList.remove("hidden");
  
  const totalQuestions = shuffledQuestions.length;
  let medal = "🥉";
  let encouragement = "";
  
  if (currentScore === 10) {
    medal = "🥇";
    encouragement = "🎉🌟 آفرین! درس را عالی یاد گرفتی! 🌟🎉";
  } else if (currentScore >= 8) {
    medal = "🥈";
    encouragement = "👏 خیلی خوب! دانشت عالی است! 👏";
  } else if (currentScore >= 5) {
    medal = "🥉";
    encouragement = "👍 خوب بود! می‌توانی بهتر هم شوی! 👍";
  } else {
    medal = "🥉";
    encouragement = "💪 آفرین! بیشتر تلاش کن تا مطالب در یادت بماند! 💪";
  }
  
  document.getElementById("medal").textContent = medal;
  document.getElementById("resultText").innerHTML = 
    `🌟 امتیاز شما: ${currentScore} از ${totalQuestions}<br><br>${encouragement}`;
  
  if (currentScore >= 8) {
    createConfetti();
    setTimeout(createConfetti, 500);
    setTimeout(createConfetti, 1000);
  }
}

function startGame() {
  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  initGame();
}

function restartGame() {
  document.getElementById("finishPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  initGame();
}

document.addEventListener("DOMContentLoaded", function() {
  const startBtn = document.getElementById("startBtn");
  if (startBtn) {
    startBtn.addEventListener("click", startGame);
  }
  
  const restartBtn = document.getElementById("restartBtn");
  if (restartBtn) {
    restartBtn.addEventListener("click", restartGame);
  }
});
</script>
</body>
</html>
