<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زیست‌یار</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#0b1f3a,#0f766e);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:900px;
background:white;
color:#111;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.hidden{
display:none;
}

.question{
font-size:34px;
font-weight:bold;
margin:25px 0;
}

.btn{
width:100%;
padding:18px;
margin-top:10px;
border:none;
border-radius:15px;
font-size:22px;
cursor:pointer;
background:#0ea5e9;
color:white;
}

.btn:hover{
opacity:.9;
}

.message{
min-height:50px;
font-size:26px;
font-weight:bold;
margin:15px 0;
}

.medal{
font-size:90px;
}

.confetti{
position:fixed;
font-size:28px;
pointer-events:none;
z-index:9999;
}

@media(max-width:700px){

.question{
font-size:26px;
}

.btn{
font-size:18px;
}

}
</style>
</head>

<body>

<div id="startPage" class="card">

<h1>🧬 زیست‌یار</h1>

<h3>طراح: خانم معصومه مرتجایی</h3>

<br>

<p>
نوع رابطه همزیستی موجودات زیر را مشخص کنید.
</p>

<br>

<button class="btn" onclick="startGame()">
🎮 شروع بازی
</button>

</div>

<div id="gamePage" class="card hidden">

<div>
سؤال
<span id="current">1</span>
از 10
</div>

<div id="msg" class="message"></div>

<div id="question" class="question"></div>

<button class="btn" onclick="answer('همیاری')">
🤝 همیاری
</button>

<button class="btn" onclick="answer('همسفرگی')">
🍽️ همسفرگی
</button>

<button class="btn" onclick="answer('انگلی')">
🪱 انگلی
</button>

<br>

<h3>
⭐ امتیاز:
<span id="score">0</span>
</h3>

</div>

<div id="finishPage" class="card hidden">

<div id="medal" class="medal"></div>

<h1>🎉 پایان بازی</h1>

<br>

<p id="resultText"></p>

<br>

<h3>طراح: خانم معصومه مرتجایی</h3>

</div>

<script>

const questions=[

["مورچه و شته","همیاری"],
["زنبور و گل","همیاری"],
["میگوی تمیزکننده و کوسه","همیاری"],
["گلسنگ","همیاری"],
["باکتری روده و انسان","همیاری"],
["شیر و کفتار","همسفرگی"],
["ماهی کوچک و کوسه","همسفرگی"],
["لاک‌پشت و جلبک","همسفرگی"],
["کرمک و انسان","انگلی"],
["کنه و گاو","انگلی"]

];

questions.sort(()=>Math.random()-0.5);

const praise=[

"🌟 آفرین",
"👏 احسنت",
"🎉 عالی بود",
"⭐ خیلی خوب گفتی",
"🏆 درست است"

];

let index=0;
let score=0;

function confetti(count){

for(let i=0;i<count;i++){

const c=document.createElement("div");

c.className="confetti";

c.innerHTML=["🎊","🎉","✨"][Math.floor(Math.random()*3)];

c.style.left=Math.random()*100+"vw";

c.style.top="-30px";

document.body.appendChild(c);

let y=-30;

const fall=setInterval(()=>{

y+=8;

c.style.top=y+"px";

if(y>window.innerHeight){

clearInterval(fall);

c.remove();

}

},20);

}

}

function startGame(){

document.getElementById("startPage").classList.add("hidden");

document.getElementById("gamePage").classList.remove("hidden");

showQuestion();

}

function showQuestion(){

document.getElementById("current").textContent=index+1;

document.getElementById("question").textContent=
questions[index][0];

document.getElementById("msg").textContent="";

}

function answer(choice){

const correct=questions[index][1];

if(choice===correct){

score++;

document.getElementById("score").textContent=score;

document.getElementById("msg").style.color="green";

document.getElementById("msg").textContent=
praise[Math.floor(Math.random()*praise.length)];

confetti(30);

setTimeout(()=>{

index++;

if(index>=questions.length){

finishGame();

}else{

showQuestion();

}

},1000);

}else{

document.getElementById("msg").style.color="red";

document.getElementById("msg").textContent=
"❌ پاسخ اشتباه است، دوباره تلاش کن.";

}

}

function finishGame(){

document.getElementById("gamePage")
.classList.add("hidden");

document.getElementById("finishPage")
.classList.remove("hidden");

confetti(120);

let medal="🥉";

if(score>=8){

medal="🥇";

}else if(score>=5){

medal="🥈";

}

document.getElementById("medal").textContent=medal;

document.getElementById("resultText").innerHTML=

"🌟 شما موفق شدید "
+ score +
" امتیاز از 10 کسب کنید.";

}

</script>

</body>
</html>
