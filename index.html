<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>زیست‌یار | بازی همزیستی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: 'Vazirmatn', sans-serif;
}

.card {
  width: 100%;
  max-width: 700px;
  background: white;
  border-radius: 40px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  text-align: center;
}

.hidden {
  display: none;
}

/* لوگو */
.logo-circle {
  width: 100px;
  height: 100px;
  background: linear-gradient(135deg, #1e3a5f, #0f766e);
  border-radius: 50%;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.school-name {
  background: #e0f2fe;
  padding: 8px 20px;
  border-radius: 50px;
  display: inline-block;
  font-weight: 700;
  margin-bottom: 20px;
  font-size: 0.9rem;
  color: #1e3a5f;
}

/* عنوان با DNA */
.title {
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.dna-icon {
  font-size: 2rem;
}

.designer {
  font-size: 0.9rem;
  color: #0f766e;
  margin-bottom: 15px;
}

/* دکمه‌ها */
.btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  background: #0ea5e9;
  color: white;
  transition: 0.1s;
}

.btn:active {
  transform: scale(0.97);
}

.correct-highlight {
  background: #22c55e !important;
}

.wrong-highlight {
  background: #ef4444 !important;
  animation: shakeAnim 0.25s ease-in-out 2;
}

@keyframes shakeAnim {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* پیام */
.msg-box {
  background: #f1f5f9;
  border-radius: 50px;
  padding: 12px;
  margin: 15px 0;
  min-height: 75px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* سوال */
.question-box {
  background: #f1f5f9;
  border-radius: 35px;
  padding: 20px;
  margin: 15px 0;
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.4;
}

/* پیشرفت */
.progress-badge {
  display: inline-block;
  background: #e2e8f0;
  padding: 5px 18px;
  border-radius: 30px;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 10px;
}

/* امتیاز */
.score-panel {
  background: #f1f5f9;
  padding: 10px;
  border-radius: 50px;
  margin-top: 15px;
  font-weight: 700;
}

.score-number {
  color: #0f766e;
  font-size: 1.6rem;
  font-weight: 800;
}

/* مدال */
.medal-icon {
  font-size: 80px;
  margin-bottom: 10px;
}

@media (max-width: 550px) {
  .card { padding: 20px; }
  .question-box { font-size: 1.2rem; padding: 15px; }
  .btn { font-size: 1rem; padding: 12px; }
  .title { font-size: 1.6rem; }
  .dna-icon { font-size: 1.6rem; }
  .logo-circle { width: 75px; height: 75px; }
}
</style>
</head>
<body>

<!-- ========== صفحه شروع ========== -->
<div id="startPage" class="card">
  <div class="logo-circle">
    <img src="sampad-logo.jpg" alt="سمپاد" onerror="this.parentElement.innerHTML='<span style=\"font-size:50px;\">🎓</span>'">
  </div>
  <div class="school-name">🏫 مدرسه فرزانگان ۱ شهریار</div>
  <div class="title">
    <span class="dna-icon">🧬</span>
    <span>زیست‌یار</span>
  </div>
  <div class="designer">✨ طراح: خانم معصومه مرتجایی</div>
  <p style="margin: 15px 0 5px;">شرکت‌کننده گرامی</p>
  <p style="margin-bottom: 20px; font-size: 0.9rem;">نوع رابطه همزیستی موجودات زیر را مشخص کنید.</p>
  <button class="btn" id="startBtn">🎮 شروع بازی</button>
</div>

<!-- ========== صفحه بازی ========== -->
<div id="gamePage" class="card hidden">
  <div class="progress-badge">📖 سوال <span id="qNumber">1</span> از <span id="totalQ">10</span></div>
  <div id="msgBox" class="msg-box"></div>
  <div id="questionText" class="question-box"></div>
  <button class="btn" id="ans1">🤝 همیاری</button>
  <button class="btn" id="ans2">🍽️ همسفرگی</button>
  <button class="btn" id="ans3">🪱 انگلی</button>
  <div class="score-panel">⭐ امتیاز: <span id="scoreValue" class="score-number">0</span></div>
</div>

<!-- ========== صفحه پایان ========== -->
<div id="endPage" class="card hidden">
  <div id="medalIcon" class="medal-icon">🥇</div>
  <div class="title">🎉 پایان بازی</div>
  <p id="endMsg" style="margin: 15px 0; font-size: 1rem;"></p>
  <button class="btn" id="restartBtn">🔄 بازی دوباره</button>
</div>

<script>
// ========== سوالات ==========
const allQuestions = [
  { text: "🐜 مورچه و شته 🐞", answer: "همیاری" },
  { text: "🐝 زنبور و گل 🌸", answer: "همیاری" },
  { text: "🦐 میگوی تمیزکننده و کوسه 🦈", answer: "همیاری" },
  { text: "🍄 گلسنگ (قارچ + جلبک) 🌿", answer: "همیاری" },
  { text: "🦠 باکتری روده و انسان 👤", answer: "همیاری" },
  { text: "🦁 شیر و کفتار 🐾", answer: "همسفرگی" },
  { text: "🐟 ماهی کوچک و کوسه 🦈", answer: "همسفرگی" },
  { text: "🐢 لاک‌پشت و جلبک 🪸", answer: "همسفرگی" },
  { text: "🪱 کرمک و انسان 👤", answer: "انگلی" },
  { text: "🕷️ کنه و گاو 🐄", answer: "انگلی" }
];

// پیام‌ها
const goodMessages = ["آفرین ✨", "احسنت 🌟", "عالی بود 🎉"];
const badMessages = ["دوباره فکر کن 💭", "دقت کن 🎯", "یک بار دیگر تلاش کن 🔄"];

// متغیرهای بازی
let shuffledQuestions = [];
let currentIndex = 0;
let currentScore = 0;
let isLocked = false;

// تصادفی کردن
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// نمایش کانفتی ساده
function showConfetti() {
  const emojis = ["🎉", "✨", "🌟", "⭐"];
  for (let i = 0; i < 35; i++) {
    const el = document.createElement("div");
    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.position = "fixed";
    el.style.left = Math.random() * 100 + "%";
    el.style.top = "-30px";
    el.style.fontSize = (16 + Math.random() * 14) + "px";
    el.style.pointerEvents = "none";
    el.style.zIndex = "9999";
    el.style.transition = "all 2s ease-out";
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transform = `translateY(${window.innerHeight + 50}px) rotate(${Math.random() * 360}deg)`;
      el.style.opacity = "0";
    });
    setTimeout(() => el.remove(), 2000);
  }
}

// نمایش سوال فعلی
function showCurrentQuestion() {
  if (currentIndex >= shuffledQuestions.length) {
    endGame();
    return;
  }
  
  document.getElementById("qNumber").innerText = currentIndex + 1;
  document.getElementById("questionText").innerHTML = shuffledQuestions[currentIndex].text;
  
  const msgDiv = document.getElementById("msgBox");
  msgDiv.innerHTML = "";
  msgDiv.style.background = "#f1f5f9";
  msgDiv.style.color = "#1e293b";
  
  // فعال کردن دکمه‌ها
  const btns = ["ans1", "ans2", "ans3"];
  btns.forEach(id => {
    const btn = document.getElementById(id);
    btn.disabled = false;
    btn.classList.remove("correct-highlight", "wrong-highlight");
  });
  
  isLocked = false;
}

// پاسخ دادن
function onAnswer(selected, btnElement) {
  if (isLocked) return;
  
  const correct = shuffledQuestions[currentIndex].answer;
  const msgDiv = document.getElementById("msgBox");
  
  isLocked = true;
  
  // غیرفعال کردن دکمه‌ها
  const btns = ["ans1", "ans2", "ans3"];
  btns.forEach(id => { document.getElementById(id).disabled = true; });
  
  if (selected === correct) {
    // پاسخ صحیح
    currentScore++;
    document.getElementById("scoreValue").innerText = currentScore;
    
    const goodMsg = goodMessages[Math.floor(Math.random() * goodMessages.length)];
    msgDiv.innerHTML = `✅ ${goodMsg}`;
    msgDiv.style.background = "#dcfce7";
    msgDiv.style.color = "#166534";
    
    btnElement.classList.add("correct-highlight");
    showConfetti();
    
    setTimeout(() => {
      btnElement.classList.remove("correct-highlight");
      currentIndex++;
      showCurrentQuestion();
    }, 900);
    
  } else {
    // پاسخ اشتباه - امتیاز کم نمی‌شود
    const badMsg = badMessages[Math.floor(Math.random() * badMessages.length)];
    msgDiv.innerHTML = `❌ ${badMsg}<br>📖 دوباره تلاش کن!`;
    msgDiv.style.background = "#fee2e2";
    msgDiv.style.color = "#991b1b";
    
    btnElement.classList.add("wrong-highlight");
    
    setTimeout(() => {
      btnElement.classList.remove("wrong-highlight");
      
      // فعال کردن مجدد دکمه‌ها
      btns.forEach(id => { document.getElementById(id).disabled = false; });
      isLocked = false;
      
      // پاک کردن پیام بعد از 1.5 ثانیه
      setTimeout(() => {
        if (msgDiv.innerHTML.includes("❌")) {
          msgDiv.innerHTML = "";
          msgDiv.style.background = "#f1f5f9";
        }
      }, 1300);
    }, 900);
  }
}

// پایان بازی
function endGame() {
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("endPage").classList.remove("hidden");
  
  const total = shuffledQuestions.length;
  let medal = "🥉";
  let message = "";
  
  if (currentScore === 10) {
    medal = "🥇";
    message = "🎉🌟 آفرین! درس را عالی یاد گرفتی! 🌟🎉";
  } else if (currentScore >= 8) {
    medal = "🥈";
    message = "👏 خیلی خوب! دانشت عالی است! 👏";
  } else if (currentScore >= 5) {
    medal = "🥉";
    message = "👍 خوب بود! می‌توانی بهتر هم شوی! 👍";
  } else {
    medal = "🥉";
    message = "💪 آفرین! بیشتر تلاش کن تا مطالب در یادت بماند! 💪";
  }
  
  document.getElementById("medalIcon").innerHTML = medal;
  document.getElementById("endMsg").innerHTML = `🌟 امتیاز شما: ${currentScore} از ${total}<br><br>${message}`;
}

// شروع بازی
function startGame() {
  shuffledQuestions = shuffleArray([...allQuestions]);
  currentIndex = 0;
  currentScore = 0;
  isLocked = false;
  
  document.getElementById("scoreValue").innerText = "0";
  document.getElementById("totalQ").innerText = shuffledQuestions.length;
  
  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("endPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  
  showCurrentQuestion();
}

// اتصال رویدادها
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("ans1").addEventListener("click", () => onAnswer("همیاری", document.getElementById("ans1")));
document.getElementById("ans2").addEventListener("click", () => onAnswer("همسفرگی", document.getElementById("ans2")));
document.getElementById("ans3").addEventListener("click", () => onAnswer("انگلی", document.getElementById("ans3")));
</script>
</body>
</html>
