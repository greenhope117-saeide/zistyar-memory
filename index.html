<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>زیست‌یار - همزیستی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Vazirmatn,sans-serif;background:linear-gradient(135deg,#0b1f3a,#0f766e);color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
h1,h2{text-align:center}
.section{background:#ffffff12;border-radius:20px;padding:15px;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card,.rel{padding:16px;border-radius:16px;text-align:center;cursor:pointer;transition:.25s}
.card{background:#fff;color:#111}
.rel{background:#0ea5e9}
.selected{outline:4px solid gold}
.correct{background:#22c55e!important;color:#fff!important}
.wrong{background:#ef4444!important;color:#fff!important}
.score{text-align:center;font-size:22px}
#win{display:none;background:#fff;color:#111;padding:20px;border-radius:20px;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>🧬 زیست‌یار</h1>
<h2>✨ طراح: خانم معصومه مرتجایی</h2>

<div class="score">⭐ امتیاز: <span id="score">0</span> / 10</div>

<div class="section">
<h3>موجودات</h3>
<div id="items" class="grid"></div>
</div>

<div class="section">
<h3>نوع رابطه</h3>
<div id="relations" class="grid"></div>
</div>

<div id="win">
<h1>🏆 تبریک!</h1>
<p>🌟 شرکت‌کننده عزیز، همه روابط همزیستی را درست شناسایی کردید.</p>
</div>
</div>

<script>
const data=[
["مورچه و شته","همیاری"],
["زنبور و گل","همیاری"],
["میگوی تمیزکننده و کوسه","همیاری"],
["گلسنگ","همیاری"],
["باکتری روده و انسان","همیاری"],
["شیر و کفتار","همسفرگی"],
["ماهی کوچک و کوسه","همسفرگی"],
["لاک‌پشت و جلبک","همسفرگی"],
["کرمک و انسان","انگلی"],
["کنه و گاو","انگلی"]
];

const relations=["همیاری","همسفرگی","انگلی"];

let selectedItem=null;
let selectedRelation=null;
let score=0;

const itemsBox=document.getElementById("items");
const relBox=document.getElementById("relations");

data.forEach(d=>{
 let el=document.createElement("div");
 el.className="card";
 el.textContent=d[0];
 el.dataset.answer=d[1];

 el.onclick=()=>{
   if(el.classList.contains("correct")) return;
   document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
   el.classList.add("selected");
   selectedItem=el;
   check();
 };
 itemsBox.appendChild(el);
});

relations.forEach(r=>{
 let el=document.createElement("div");
 el.className="rel";
 el.textContent=r;

 el.onclick=()=>{
   document.querySelectorAll(".rel").forEach(x=>x.classList.remove("selected"));
   el.classList.add("selected");
   selectedRelation=el;
   check();
 };
 relBox.appendChild(el);
});

function check(){
 if(!selectedItem || !selectedRelation) return;

 if(selectedItem.dataset.answer===selectedRelation.textContent){
   selectedItem.classList.remove("selected");
   selectedItem.classList.add("correct");
   score++;
   document.getElementById("score").textContent=score;

   if(score===10){
     document.getElementById("win").style.display="block";
   }
 }else{
   selectedItem.classList.add("wrong");
   setTimeout(()=>selectedItem.classList.remove("wrong"),700);
 }

 selectedItem=null;
 document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
 document.querySelectorAll(".rel").forEach(x=>x.classList.remove("selected"));
 selectedRelation=null;
}
</script>
</body>
</html>
