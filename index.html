<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>زیست‌یار</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Vazirmatn,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#0f766e);
color:white;
overflow:hidden;
}

.screen{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:white;
color:#111;
max-width:800px;
width:100%;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.hidden{
display:none;
}

button{
font-family:inherit;
padding:14px 25px;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
margin:8px;
}

.startBtn{
background:#06b6d4;
color:white;
}

.option{
display:block;
width:100%;
margin:12px 0;
background:#0ea5e9;
color:white;
}

.option:hover{
transform:scale(1.02);
}

#question{
font-size:34px;
margin:30px 0;
font-weight:800;
}

#message{
font-size:26px;
height:50px;
font-weight:bold;
}

.correct{
color:#16a34a;
}

.wrong{
color:#dc2626;
}

.progress{
height:18px;
background:#ddd;
border-radius:99px;
overflow:hidden;
margin:20px 0;
}

.bar{
height:100%;
width:0;
background:#22c55e;
transition:.4s;
}

.medal{
font-size:90px;
}

.confetti{
position:fixed;
width:12px;
height:12px;
top:-20px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>
<body>

<div id="intro" class="screen">
<div class="card">
<h1>🧬 زیست‌یار</h1>

<h2>✨ طراح: خانم معصومه مرتجایی</h2>

<p style="font-size:22px">
شرکت‌کننده گرامی، نوع رابطه همزیستی موجودات زیر را مشخص کنید.
</p>

<button class="startBtn" onclick="startGame()">
شروع بازی
</button>

</div>
</div>

<div id="game" class="screen hidden">
<div class="card">

<h2>
سؤال <span id="current">1</span> از 10
</h2>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div id="question"></div>

<div id="message"></div>

<button class="option" onclick="checkAnswer('همیاری')">
🤝 همیاری
</button>

<button class="option" onclick="checkAnswer('همسفرگی')">
🍽️ همسفرگی
</button>

<button class="option" onclick="checkAnswer('انگلی')">
🪱 انگلی
</button>

</div>
</div>

<div id="finish" class="screen hidden">
<div class="card">

<div id="medal" class="medal">
🥇
</div>

<h1>🏆 پایان بازی</h1>

<p id="resultText" style="font-size:24px"></p>

</div>
</div>

<script>

const questions=[

["مورچه و شته","همیاری"],
["زنبور و گل","همیاری"],
["میگوی تمیزکننده و کوسه","همیاری"],
["گلسنگ","همیاری"],
["باکتری روده و انسان","همیاری"],

["شیر و کفتار","همسفرگی"],
["ماهی کوچک و کوسه","همسفرگی"],
["لاک‌پشت و جلبک","همسفرگی"],

["کرمک و انسان","انگلی"],
["کنه و گاو","انگلی"]

];

questions.sort(()=>Math.random()-0.5);

let index=0;
let score=0;

const praises=[
"🌟 آفرین",
"👏 احسنت",
"🎉 خیلی خوب گفتی",
"⭐ عالی بود"
];

const errors=[
"⚠️ دقت کن",
"❌ متأسفم اشتباه بود",
"🤔 دوباره فکر کن"
];

function startGame(){

intro.classList.add("hidden");
game.classList.remove("hidden");

showQuestion();

}

function showQuestion(){

document.getElementById("question").innerHTML=
questions[index][0];

document.getElementById("current").textContent=
index+1;

document.getElementById("message").innerHTML="";

}

function checkAnswer(answer){

const correct=
questions[index][1];

if(answer===correct){

score++;

document.getElementById("message").className="correct";

document.getElementById("message").innerHTML=
praises[Math.floor(Math.random()*praises.length)];

smallConfetti();

document.getElementById("bar").style.width=
(score/10*100)+"%";

setTimeout(()=>{

index++;

if(index>=questions.length){

finishGame();

}else{

showQuestion();

}

},1200);

}else{

document.getElementById("message").className="wrong";

document.getElementById("message").innerHTML=
errors[Math.floor(Math.random()*errors.length)];

}

}

function finishGame(){

game.classList.add("hidden");
finish.classList.remove("hidden");

let medal="🥉";

if(score>=7) medal="🥈";

if(score===10) medal="🥇";

document.getElementById("medal").textContent=
medal;

let msg="";

if(score===10){

msg="🌟 آفرین عزیزم! این مبحث را خیلی خوب بلد بودی یا به خوبی یاد گرفتی.";

}else if(score>=7){

msg="👏 خیلی خوب بود! فقط کمی تمرین بیشتر لازم داری.";

}else{

msg="📚 تلاش خوبی داشتی. دوباره بازی کن تا حرفه‌ای‌تر شوی.";

}

document.getElementById("resultText").innerHTML=
"امتیاز شما: "+score+" از 10<br><br>"+msg;

bigConfetti();

}

function smallConfetti(){

for(let i=0;i<20;i++){

createPiece();

}

}

function bigConfetti(){

for(let i=0;i<120;i++){

setTimeout(createPiece,i*20);

}

}

function createPiece(){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=
`hsl(${Math.random()*360},100%,50%)`;

document.body.appendChild(c);

setTimeout(()=>c.remove(),3000);

}

</script>

</body>
</html>
